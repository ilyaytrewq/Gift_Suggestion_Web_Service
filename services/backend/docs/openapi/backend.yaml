openapi: 3.1.0
info:
  title: Gift Suggestion Backend API
  version: 0.2.0
  description: |
    Backend API gateway for the Gift Suggestion Web Service.
    The specification is maintained manually and currently covers health,
    auth/user foundation, catalog read endpoints, wishlist endpoints,
    admin catalog import endpoints, recommendation endpoints, tracking endpoints,
    and VK integration scaffold endpoints.
servers:
  - url: http://localhost:8080
tags:
  - name: health
  - name: auth
  - name: users
  - name: catalog
  - name: wishlist
  - name: admin-import
  - name: recommendation
  - name: tracking
  - name: vk-integration
paths:
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getLiveness
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadiness
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          description: Required dependency is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
  /api/v1/users:
    post:
      tags: [auth, users]
      summary: Register user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login user
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token issued, refresh token returned via HttpOnly cookie
          headers:
            Set-Cookie:
              description: Refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      operationId: refreshToken
      parameters:
        - in: cookie
          name: refresh_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New access token issued, refresh cookie rotated
          headers:
            Set-Cookie:
              description: Rotated refresh token cookie
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshEnvelope'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      summary: Request password reset
      operationId: requestPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Password reset request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/users/me:
    get:
      tags: [users]
      summary: Get current user profile
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [users]
      summary: Update current user profile
      operationId: updateCurrentUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalog/gifts:
    get:
      tags: [catalog]
      summary: Browse catalog gifts
      operationId: listCatalogGifts
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/CategoryIDQuery'
        - $ref: '#/components/parameters/MinPriceQuery'
        - $ref: '#/components/parameters/MaxPriceQuery'
        - $ref: '#/components/parameters/AgeRestrictionQuery'
        - $ref: '#/components/parameters/HasImageQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/GiftSortQuery'
      responses:
        '200':
          description: Gift list page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListGiftsEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalog/gifts/{gift_id}:
    get:
      tags: [catalog]
      summary: Get gift card
      operationId: getCatalogGift
      parameters:
        - $ref: '#/components/parameters/GiftIDPath'
      responses:
        '200':
          description: Gift detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetGiftEnvelope'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Gift not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/catalog/categories:
    get:
      tags: [catalog]
      summary: List catalog categories
      operationId: listCatalogCategories
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
        - $ref: '#/components/parameters/CategorySortQuery'
      responses:
        '200':
          description: Category list page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCategoriesEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/wishlists:
    get:
      tags: [wishlist]
      summary: List current user wishlists
      operationId: listWishlists
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Wishlist list page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistListEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags: [wishlist]
      summary: Create wishlist
      operationId: createWishlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWishlistRequest'
      responses:
        '201':
          description: Wishlist created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Wishlist name already exists for the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/wishlists/{wishlist_id}:
    get:
      tags: [wishlist]
      summary: Get current user wishlist with items
      operationId: getWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WishlistIDPath'
      responses:
        '200':
          description: Wishlist detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistEnvelope'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Wishlist not found or unavailable to current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [wishlist]
      summary: Delete current user wishlist
      operationId: deleteWishlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WishlistIDPath'
      responses:
        '200':
          description: Wishlist deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWishlistEnvelope'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Wishlist not found or unavailable to current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/wishlists/{wishlist_id}/items:
    post:
      tags: [wishlist]
      summary: Add gift to current user wishlist
      operationId: addWishlistItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WishlistIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddWishlistItemRequest'
      responses:
        '201':
          description: Gift added to wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddWishlistItemEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Wishlist or gift not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Gift already exists in wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/wishlists/{wishlist_id}/items/{gift_id}:
    delete:
      tags: [wishlist]
      summary: Remove gift from current user wishlist
      operationId: removeWishlistItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/WishlistIDPath'
        - $ref: '#/components/parameters/GiftIDPath'
      responses:
        '200':
          description: Gift removed from wishlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemoveWishlistItemEnvelope'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Wishlist or wishlist item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/import-jobs:
    post:
      tags: [admin-import]
      summary: Upload catalog import file
      operationId: createImportJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                source:
                  type: string
      responses:
        '201':
          description: Import job created and processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobEnvelope'
        '400':
          description: Invalid multipart payload, unsupported format, empty file or invalid file size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin role is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/import-jobs/{job_id}:
    get:
      tags: [admin-import]
      summary: Get import job detail
      operationId: getImportJob
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobIDPath'
      responses:
        '200':
          description: Import job detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobEnvelope'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin role is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Import job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/admin/import-jobs/{job_id}/errors:
    get:
      tags: [admin-import]
      summary: List import job errors
      operationId: listImportJobErrors
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ImportJobIDPath'
        - $ref: '#/components/parameters/LimitQuery'
        - $ref: '#/components/parameters/OffsetQuery'
      responses:
        '200':
          description: Import job error list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJobErrorsEnvelope'
        '400':
          description: Invalid identifier or query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Admin role is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Import job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/recommendations:
    post:
      tags: [recommendation]
      summary: Generate gift recommendations for the current user
      description: |
        Current HTTP contract is auth-only.
        Guest recommendation flow is intentionally deferred to a later iteration.
      operationId: createRecommendation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendRequest'
      responses:
        '200':
          description: Recommendation set generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/recommendations/{request_id}:
    get:
      tags: [recommendation]
      summary: Get recommendation set by request id
      operationId: getRecommendation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RecommendationRequestIDPath'
      responses:
        '200':
          description: Recommendation set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationEnvelope'
        '400':
          description: Invalid identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Recommendation request not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/tracking/events:
    post:
      tags: [tracking]
      summary: Record a user interaction event
      description: |
        Auth-only tracking ingestion endpoint.
        Repeated requests with the same `client_event_id` for the same user are treated idempotently.
      operationId: trackEvent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackEventRequest'
      responses:
        '201':
          description: Tracking event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingEventEnvelope'
        '200':
          description: Duplicate client event id accepted idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingEventEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Related resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: client_event_id is reused for another payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/integrations/vk/connection:
    get:
      tags: [vk-integration]
      summary: Get current VK connection
      description: |
        Returns the current user's VK integration state. If the user never linked VK,
        the endpoint still returns `200` with `state=disconnected`.
      operationId: getCurrentVKConnection
      security:
        - bearerAuth: []
      responses:
        '200':
          description: VK connection state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VKConnectionEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: VK integration is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [vk-integration]
      summary: Connect or update current VK connection
      operationId: connectVK
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectVKRequest'
      responses:
        '200':
          description: VK connection updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VKConnectionEnvelope'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Another active VK account is already linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: VK integration is disabled or token storage is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [vk-integration]
      summary: Disconnect current VK connection
      operationId: disconnectVK
      security:
        - bearerAuth: []
      responses:
        '200':
          description: VK connection disconnected or already absent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VKConnectionEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: VK integration is disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /api/v1/integrations/vk/connection/sync-interests:
    post:
      tags: [vk-integration]
      summary: Sync interests from VK
      description: |
        Starts a synchronous interests import for the current user using the stored VK credential metadata.
      operationId: syncVKInterests
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Interests sync completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VKConnectionEnvelope'
        '401':
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Connection is not ready or consent/token metadata is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: VK integration is disabled or external import path is unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    GiftIDPath:
      in: path
      name: gift_id
      required: true
      schema:
        type: string
        format: uuid
    WishlistIDPath:
      in: path
      name: wishlist_id
      required: true
      schema:
        type: string
        format: uuid
    ImportJobIDPath:
      in: path
      name: job_id
      required: true
      schema:
        type: string
        format: uuid
    RecommendationRequestIDPath:
      in: path
      name: request_id
      required: true
      schema:
        type: string
        format: uuid
    SearchQuery:
      in: query
      name: q
      required: false
      schema:
        type: string
        maxLength: 256
    CategoryIDQuery:
      in: query
      name: category_id
      required: false
      schema:
        type: string
        format: uuid
    MinPriceQuery:
      in: query
      name: min_price
      required: false
      schema:
        type: string
        pattern: '^\d+(\.\d{1,2})?$'
    MaxPriceQuery:
      in: query
      name: max_price
      required: false
      schema:
        type: string
        pattern: '^\d+(\.\d{1,2})?$'
    AgeRestrictionQuery:
      in: query
      name: age_restriction
      required: false
      schema:
        type: integer
        enum: [0, 12, 16, 18]
    HasImageQuery:
      in: query
      name: has_image
      required: false
      schema:
        type: boolean

version: '3'

# Глобальные переменные проекта
vars:
  GO_VERSION: '1.26'
  GOLANGCI_LINT_VERSION: 'v2.8.0'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'

  BIN_DIR: '{{.ROOT_DIR}}/bin'
  GOLANGCI_LINT: '{{.BIN_DIR}}/golangci-lint'
  GCI: '{{.BIN_DIR}}/gci'
  GOFUMPT: '{{.BIN_DIR}}/gofumpt'
  GO_CMD:
    sh: command -v ya >/dev/null 2>&1 && echo 'ya tool go' || echo go

tasks:
  install-formatters:
    desc: "Устанавливает форматтеры gci и gofumpt в ./bin"
    cmds:
      - |
        [ -f {{.GOFUMPT}} ] || {
          echo '📦 Устанавливаем gofumpt {{.GOFUMPT_VERSION}}...'
          GOBIN={{.BIN_DIR}} {{.GO_CMD}} install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}
        }
        [ -f {{.GCI}} ] || {
          echo '📦 Устанавливаем gci {{.GCI_VERSION}}...'
          GOBIN={{.BIN_DIR}} {{.GO_CMD}} install github.com/daixiang0/gci@{{.GCI_VERSION}}
        }
    status:
      - test -x {{.GOFUMPT}}
      - test -x {{.GCI}}

  format:
    desc: "Форматирует весь проект gofumpt + gci"
    deps: [ install-formatters ]
    cmds:
      - |
        echo "🧼 Форматируем через gofumpt ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GOFUMPT}} -extra -w {} +
      - |
        echo "🎯 Сортируем импорты через gci ..."
        find . -type f -name '*.go' ! -path '*/mocks/*' -exec {{.GCI}} write -s standard -s default -s "prefix(github.com/ilyaytrewq/Gift_Suggestion_Web_Service)" {} +

  install-golangci-lint:
    desc: "Устанавливает golangci-lint в каталог bin"
    cmds:
      - |
        [ -f {{.GOLANGCI_LINT}} ] || {
          mkdir -p {{.BIN_DIR}}
          echo "📦 Устанавливаем golangci-lint {{.GOLANGCI_LINT_VERSION}}..."
          GOBIN={{.BIN_DIR}} {{.GO_CMD}} install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.GOLANGCI_LINT}}

  lint:
    desc: "Запускает golangci-lint для всех модулей"
    deps: [ install-golangci-lint ]
    cmds:
      - '{{.GOLANGCI_LINT}} run ./... --config=.golangci.yml'

  run:
    desc: "Запускает backend API локально"
    cmds:
      - '{{.GO_CMD}} run ./cmd/api'

  build:
    desc: "Собирает backend binary"
    cmds:
      - '{{.GO_CMD}} build ./cmd/api'

  gen:proto:
    desc: "Генерирует Go код из .proto файлов (требует protoc, protoc-gen-go, protoc-gen-go-grpc)"
    cmds:
      - |
        protoc \
          --proto_path=api/proto \
          --go_out=. \
          --go_opt=module=github.com/ilyaytrewq/Gift_Suggestion_Web_Service \
          --go-grpc_out=. \
          --go-grpc_opt=module=github.com/ilyaytrewq/Gift_Suggestion_Web_Service \
          api/proto/ranking/v1/ranking.proto

  tests:
    desc: "Запускает все тесты"
    cmds:
      - '{{.GO_CMD}} test ./... -v'

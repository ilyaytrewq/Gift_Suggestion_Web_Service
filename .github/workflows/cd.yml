name: cd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production
      ref:
        description: Git ref to deploy (optional)
        required: false
        type: string
  push:
    branches: [main]

concurrency:
  group: cd-${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  resolve-target:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      environment: ${{ steps.resolve.outputs.environment }}
      ref: ${{ steps.resolve.outputs.ref }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
          INPUT_REF: ${{ inputs.ref }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          target_ref="${GIT_SHA}"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            target_environment="${INPUT_ENVIRONMENT}"
            if [ -n "${INPUT_REF}" ]; then
              target_ref="${INPUT_REF}"
            fi
          else
            target_environment="production"
          fi

          short_sha="$(printf '%.12s' "${GIT_SHA}")"

          echo "should_deploy=true" >> "${GITHUB_OUTPUT}"
          echo "environment=${target_environment}" >> "${GITHUB_OUTPUT}"
          echo "ref=${target_ref}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=sha-${short_sha}" >> "${GITHUB_OUTPUT}"

  build-and-push:
    name: Build and push release images
    runs-on: ubuntu-latest
    needs:
      - resolve-target
    if: ${{ needs.resolve-target.outputs.should_deploy == 'true' }}
    timeout-minutes: 30
    environment: ${{ needs.resolve-target.outputs.environment }}
    outputs:
      backend_image: ${{ steps.image-refs.outputs.backend_image }}
      frontend_image: ${{ steps.image-refs.outputs.frontend_image }}
      ml_image: ${{ steps.image-refs.outputs.ml_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.ref }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image references
        id: image-refs
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.resolve-target.outputs.image_tag }}
        run: |
          set -euo pipefail
          owner="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "backend_image=ghcr.io/${owner}/gift-suggestion-backend:${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "frontend_image=ghcr.io/${owner}/gift-suggestion-frontend:${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "ml_image=ghcr.io/${owner}/gift-suggestion-ml:${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: ${{ steps.image-refs.outputs.backend_image }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
            VITE_VK_APP_ID=${{ vars.VK_APP_ID || vars.VK_ID }}
            VITE_VK_REDIRECT_URI=${{ vars.VK_REDIRECT_URI }}
          push: true
          tags: ${{ steps.image-refs.outputs.frontend_image }}

      - name: Build and push ml-service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ml/Dockerfile
          push: true
          tags: ${{ steps.image-refs.outputs.ml_image }}

  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    needs:
      - resolve-target
      - build-and-push
    if: ${{ needs.resolve-target.outputs.should_deploy == 'true' }}
    timeout-minutes: 30
    environment: ${{ needs.resolve-target.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.ref }}

      - name: Prepare SSH
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${DEPLOY_SSH_PRIVATE_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Render deployment env file
        env:
          IMAGE_TAG: ${{ needs.resolve-target.outputs.image_tag }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
          ML_IMAGE: ${{ needs.build-and-push.outputs.ml_image }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_RUNTIME_ENV_FILE: ${{ secrets.DEPLOY_RUNTIME_ENV_FILE }}
          VK_APP_ID: ${{ vars.VK_APP_ID || vars.VK_ID }}
          VK_REDIRECT_URI: ${{ vars.VK_REDIRECT_URI }}
        run: |
          set -euo pipefail
          {
            printf 'COMPOSE_PROJECT_NAME=gift-suggestion\n'
            printf 'IMAGE_TAG=%s\n' "${IMAGE_TAG}"
            printf 'BACKEND_IMAGE=%s\n' "${BACKEND_IMAGE}"
            printf 'FRONTEND_IMAGE=%s\n' "${FRONTEND_IMAGE}"
            printf 'ML_IMAGE=%s\n' "${ML_IMAGE}"
            printf 'BACKEND_PORT=8080\n'
            printf 'FRONTEND_PORT=80\n'
            printf 'FRONTEND_PUBLIC_URL=http://%s\n' "${DEPLOY_HOST}"
          } > "${RUNNER_TEMP}/deploy.env"
          printf '%s\n' "${DEPLOY_RUNTIME_ENV_FILE}" >> "${RUNNER_TEMP}/deploy.env"
          {
            printf '\n# Frontend container env + parity with Dockerfile build-args (GitHub Environment vars).\n'
            printf 'VITE_VK_APP_ID=%s\n' "${VK_APP_ID}"
            printf 'VITE_VK_REDIRECT_URI=%s\n' "${VK_REDIRECT_URI}"
          } >> "${RUNNER_TEMP}/deploy.env"

      - name: Upload deployment bundle
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p '${DEPLOY_PATH}'"
          scp docker-compose.yml "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/docker-compose.yml"
          scp "${RUNNER_TEMP}/deploy.env" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/.deploy.env"

      - name: Pull and restart services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          set -euo pipefail

          github_token_b64="$(printf '%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          github_actor_b64="$(printf '%s' "${GITHUB_ACTOR}" | base64 | tr -d '\n')"
          deploy_path_b64="$(printf '%s' "${DEPLOY_PATH}" | base64 | tr -d '\n')"

          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "GITHUB_TOKEN_B64='${github_token_b64}' GITHUB_ACTOR_B64='${github_actor_b64}' DEPLOY_PATH_B64='${deploy_path_b64}' bash -s" <<'EOF'
          set -euo pipefail
          GITHUB_TOKEN="$(printf '%s' "${GITHUB_TOKEN_B64}" | base64 -d)"
          GITHUB_ACTOR="$(printf '%s' "${GITHUB_ACTOR_B64}" | base64 -d)"
          DEPLOY_PATH="$(printf '%s' "${DEPLOY_PATH_B64}" | base64 -d)"
          cd "${DEPLOY_PATH}"
          chmod 600 .deploy.env

          printf '%s\n' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

          docker compose -p gift-suggestion --env-file .deploy.env -f docker-compose.yml down
          docker compose -p gift-suggestion --env-file .deploy.env -f docker-compose.yml up --build -d
          EOF

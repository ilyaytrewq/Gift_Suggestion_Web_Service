name: ci

on:
  pull_request:
  push:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION_FILE: services/backend/go.mod
  GOLANGCI_LINT_VERSION: v2.8.0
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GO_VERSION_FILE }}
          cache: true
          cache-dependency-path: services/backend/go.sum

      - name: Install golangci-lint
        working-directory: services/backend
        run: |
          GOBIN="${PWD}/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}

      - name: Run backend checks
        run: ./scripts/ci/backend-checks.sh

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Run frontend checks
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: ./scripts/ci/frontend-checks.sh

  docker:
    name: Docker and migration smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - backend
      - frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run docker checks
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: ./scripts/ci/docker-checks.sh

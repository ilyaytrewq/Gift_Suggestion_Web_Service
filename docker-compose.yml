services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gift_suggestion}
      POSTGRES_USER: ${POSTGRES_USER:-gift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gift}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-gift} -d ${POSTGRES_DB:-gift_suggestion}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-gift-suggestion-backend}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
      DB_DSN: ${DB_DSN:-postgres://gift:gift@postgres:5432/gift_suggestion?sslmode=disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_PING_TIMEOUT: ${DB_PING_TIMEOUT:-2s}
      DB_MIGRATIONS_ENABLED: ${DB_MIGRATIONS_ENABLED:-true}
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-5242880}
      ML_GRPC_ENABLED: ${ML_GRPC_ENABLED:-false}
      ML_GRPC_ADDR: ${ML_GRPC_ADDR:-ml-service:50051}
      ML_GRPC_DIAL_TIMEOUT: ${ML_GRPC_DIAL_TIMEOUT:-3s}
      ML_GRPC_REQUEST_TIMEOUT: ${ML_GRPC_REQUEST_TIMEOUT:-2500ms}
      ML_GRPC_MAX_RETRIES: ${ML_GRPC_MAX_RETRIES:-1}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-please}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gift-suggestion-backend}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-gift-suggestion-web-service}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-168h}
      AUTH_PASSWORD_RESET_TTL: ${AUTH_PASSWORD_RESET_TTL:-30m}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-refresh_token}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/v1/auth}
      AUTH_REFRESH_COOKIE_DOMAIN: ${AUTH_REFRESH_COOKIE_DOMAIN:-}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gift_suggestion}
      POSTGRES_USER: ${POSTGRES_USER:-gift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gift}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-gift} -d ${POSTGRES_DB:-gift_suggestion}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-gift-suggestion-backend:local}
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-gift-suggestion-backend}
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HTTP_HOST: ${HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-5s}
      HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-10s}
      HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
      DB_DSN: ${DB_DSN:-postgres://gift:gift@postgres:5432/gift_suggestion?sslmode=disable}
      DB_MAX_OPEN_CONNS: ${DB_MAX_OPEN_CONNS:-10}
      DB_MAX_IDLE_CONNS: ${DB_MAX_IDLE_CONNS:-5}
      DB_CONN_MAX_LIFETIME: ${DB_CONN_MAX_LIFETIME:-30m}
      DB_PING_TIMEOUT: ${DB_PING_TIMEOUT:-2s}
      DB_MIGRATIONS_ENABLED: ${DB_MIGRATIONS_ENABLED:-true}
      IMPORT_MAX_FILE_SIZE_BYTES: ${IMPORT_MAX_FILE_SIZE_BYTES:-5242880}
      ML_GRPC_ENABLED: ${ML_GRPC_ENABLED:-true}
      ML_GRPC_ADDR: ${ML_GRPC_ADDR:-ml-service:50051}
      ML_GRPC_DIAL_TIMEOUT: ${ML_GRPC_DIAL_TIMEOUT:-3s}
      ML_GRPC_REQUEST_TIMEOUT: ${ML_GRPC_REQUEST_TIMEOUT:-2500ms}
      ML_GRPC_MAX_RETRIES: ${ML_GRPC_MAX_RETRIES:-1}
      VK_ENABLED: ${VK_ENABLED:-false}
      VK_REQUEST_TIMEOUT: ${VK_REQUEST_TIMEOUT:-3s}
      VK_TOKEN_ENCRYPTION_KEY: ${VK_TOKEN_ENCRYPTION_KEY:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-true}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_FROM_EMAIL: ${EMAIL_FROM_EMAIL:-weather_sender@mail.ru}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-Gift Suggestion}
      EMAIL_SEND_TIMEOUT: ${EMAIL_SEND_TIMEOUT:-10s}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-smtp.mail.ru}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-weather_sender@mail.ru}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-vUiAA45J6jFbMo3I7HZ4}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change-me-please}
      AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-gift-suggestion-backend}
      AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-gift-suggestion-web-service}
      AUTH_ACCESS_TTL: ${AUTH_ACCESS_TTL:-15m}
      AUTH_REFRESH_TTL: ${AUTH_REFRESH_TTL:-168h}
      AUTH_EMAIL_VERIFICATION_TTL: ${AUTH_EMAIL_VERIFICATION_TTL:-24h}
      AUTH_PASSWORD_RESET_TTL: ${AUTH_PASSWORD_RESET_TTL:-30m}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-refresh_token}
      AUTH_REFRESH_COOKIE_PATH: ${AUTH_REFRESH_COOKIE_PATH:-/api/v1/auth}
      AUTH_REFRESH_COOKIE_DOMAIN: ${AUTH_REFRESH_COOKIE_DOMAIN:-}
      AUTH_REFRESH_COOKIE_SECURE: ${AUTH_REFRESH_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

  ml-service:
    image: ${ML_IMAGE:-gift-suggestion-ml:local}
    build:
      context: .
      dockerfile: services/ml/Dockerfile
    environment:
      ML_GRPC_PORT: ${ML_GRPC_PORT:-50051}
      ML_HTTP_PORT: ${ML_HTTP_PORT:-8081}
      ML_MODEL_PATH: ${ML_MODEL_PATH:-models/lightgbm_v2_1_0.pkl}
      ML_DB_DSN: ${DB_DSN:-postgres://gift:gift@postgres:5432/gift_suggestion?sslmode=disable}
      # Optional: overrides LOG_LEVEL for ml-service (Python wants DEBUG/INFO/WARNING/etc.)
      ML_LOG_LEVEL: ${ML_LOG_LEVEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "50051:50051"
      - "8081:8081"
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/healthz')" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE:-gift-suggestion-frontend:local}
    build:
      context: .
      dockerfile: services/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_VK_APP_ID: ${VITE_VK_APP_ID:-}
        VITE_VK_REDIRECT_URI: ${VITE_VK_REDIRECT_URI:-}
    environment:
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost}
      VITE_VK_APP_ID: ${VITE_VK_APP_ID:-}
      VITE_VK_REDIRECT_URI: ${VITE_VK_REDIRECT_URI:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null || exit 1
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
